version: '3.8'

services:
  backend:
    build:
      context: .
      target: development
    container_name: injaazh_backend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/injaazh
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - injaazh_network
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: injaazh_mongodb
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=injaazh
    volumes:
      - mongodb_data:/data/db
    networks:
      - injaazh_network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: injaazh_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - injaazh_network
    restart: unless-stopped

networks:
  injaazh_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
